[package]
name = "ghonfig"
version = "0.1.0"
edition = "2021"
description = "A TUI for configuring Ghostty, driven by Ghostty's own config schema"

[dependencies]
ratatui = "0.30"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
ratatui-textarea = "0.9.2"
throbber-widgets-tui = "0.11.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
